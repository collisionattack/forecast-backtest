<svg xmlns="http://www.w3.org/2000/svg" width="760" height="320" viewBox="0 0 760 320" role="img" aria-labelledby="t d" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif">
<title id="t">forecast error on store item demand</title>
<desc id="d">mean absolute error over 90 days for four models: last year's same days 8.88, holt-winters 9.96, seasonal naive 11.71, naive 13.29. lower is better.</desc>
<style>.num{font-variant-numeric:tabular-nums}.bg{fill:#f6f8fa;stroke:#d0d7de}.ink{fill:#24292f}.muted{fill:#57606a}.accent{fill:#0969da}.strong{fill:#57606a}.mark{fill:#8c959f}.faint{fill:#d0d7de}.train{fill:#6e7781}.on-accent{fill:#ffffff}.on-train{fill:#ffffff}.line{stroke:#d0d7de}.axis{stroke:#8c959f}.head{fill:#8c959f}</style>
<rect class="bg" x="0.5" y="0.5" width="759" height="319" rx="8"/>
<text class="ink" x="28" y="40" font-size="18" font-weight="600">store item demand: forecast error over 90 days</text>
<text class="muted" x="28" y="62" font-size="13">mean absolute error across 500 daily series and 3 origins, lower is better</text>
<line class="line" x1="246" y1="84" x2="246" y2="266" stroke-width="1"/>
<text class="ink" x="232" y="111" text-anchor="end" font-size="14">last year's same days (364)</text><path class="strong" d="M246 94H546.1a2 2 0 0 1 2 2V116a2 2 0 0 1 -2 2H246Z"/><text class="ink num" x="558.1" y="111" font-size="14" font-weight="600">8.88</text>
<text class="ink" x="232" y="159" text-anchor="end" font-size="14">holt-winters, weekly</text><path class="accent" d="M246 142H582.6a2 2 0 0 1 2 2V164a2 2 0 0 1 -2 2H246Z"/><text class="ink num" x="594.6" y="159" font-size="14" font-weight="600">9.96</text>
<text class="ink" x="232" y="207" text-anchor="end" font-size="14">seasonal naive (7)</text><path class="mark" d="M246 190H642.2a2 2 0 0 1 2 2V212a2 2 0 0 1 -2 2H246Z"/><text class="ink num" x="654.2" y="207" font-size="14" font-weight="600">11.71</text>
<text class="ink" x="232" y="255" text-anchor="end" font-size="14">naive</text><path class="mark" d="M246 238H695.9a2 2 0 0 1 2 2V260a2 2 0 0 1 -2 2H246Z"/><text class="ink num" x="707.9" y="255" font-size="14" font-weight="600">13.29</text>
<text class="muted" x="28" y="298" font-size="13">weekly holt-winters beats seasonal naive (7) in 478 of 500 series. its mean error is higher than last year's same days.</text>
</svg>
