<svg xmlns="http://www.w3.org/2000/svg" width="760" height="262" viewBox="0 0 760 262" role="img" aria-labelledby="t d" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif">
<title id="t">rolling-origin backtest</title>
<desc id="d">three forecast origins. at each one the model trains on all earlier data and forecasts the next h steps, which are scored. later data is not used yet.</desc>
<style>.num{font-variant-numeric:tabular-nums}.bg{fill:#13151f;stroke:#2b2f42}.ink{fill:#f3f4fb}.muted{fill:#a3a9c4}.on{fill:#1d1b2e}.faint{fill:#262a3b;stroke:#262a3b}.line{stroke:#2b2f42}.axis{stroke:#a3a9c4}.head{fill:#a3a9c4}.mint{fill:#74e8c8;stroke:#74e8c8}.coral{fill:#ff8fab;stroke:#ff8fab}.sky{fill:#7cc8ff;stroke:#7cc8ff}.lilac{fill:#b7a6ff;stroke:#b7a6ff}</style>
<rect class="bg" x="0.5" y="0.5" width="759" height="261" rx="14"/>
<text class="ink" x="30" y="44" font-size="20" font-weight="700">rolling-origin backtest</text>
<text class="muted" x="30" y="67" font-size="13.5">every model forecasts h steps ahead from each origin and is scored on the same windows</text>
<text class="ink" x="118" y="113" text-anchor="end" font-size="15">origin 1</text><rect class="sky" x="134" y="94" width="325.9" height="28" rx="7" stroke-width="1.5"/><rect class="coral" x="462.9" y="94" width="86.7" height="28" rx="7" stroke-width="1.5"/>
<rect class="faint" x="552.6" y="94" width="179.4" height="28" rx="7" stroke-width="1.5"/>
<text class="on" x="148" y="113" font-size="14" font-weight="600">train on earlier data</text><text class="on" x="474.9" y="113" font-size="14" font-weight="600">h steps</text><text class="muted" x="566.6" y="113" font-size="14">later data, unused</text>
<text class="ink" x="118" y="159" text-anchor="end" font-size="15">origin 2</text><rect class="sky" x="134" y="140" width="415.6" height="28" rx="7" stroke-width="1.5"/><rect class="coral" x="552.6" y="140" width="86.7" height="28" rx="7" stroke-width="1.5"/>
<rect class="faint" x="642.3" y="140" width="89.7" height="28" rx="7" stroke-width="1.5"/>
<text class="ink" x="118" y="205" text-anchor="end" font-size="15">origin 3</text><rect class="sky" x="134" y="186" width="505.3" height="28" rx="7" stroke-width="1.5"/><rect class="coral" x="642.3" y="186" width="89.7" height="28" rx="7" stroke-width="1.5"/>
<line class="axis" x1="134" y1="238" x2="726" y2="238" stroke-width="1.5"/>
<polygon class="head" points="732,238 724,234 724,242"/>
<text class="muted" x="732" y="228" text-anchor="end" font-size="12.5">time</text>
</svg>
